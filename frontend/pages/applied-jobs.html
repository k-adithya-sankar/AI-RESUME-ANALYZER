<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applied Jobs - ResumeAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/applied-jobs.css">
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="logo">
                    <i class="fa-solid fa-file-signature"></i>
                    ResumeAI
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
                <a href="upload.html" class="nav-item">
                    <i class="fa-solid fa-upload"></i>
                    Resume Analysis
                </a>
                <a href="resume-builder.html" class="nav-item">
                    <i class="fa-solid fa-pen-nib"></i>
                    Resume Builder
                </a>
                <a href="interview.html" class="nav-item">
                    <i class="fa-solid fa-comments"></i>
                    Interview Prep
                </a>
                <a href="job-matching.html" class="nav-item">
                    <i class="fa-solid fa-handshake"></i>
                    Job Matching
                </a>
                <a href="applied-jobs.html" class="nav-item active">
                    <i class="fa-solid fa-briefcase"></i>
                    Applied Jobs
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1>Applied Jobs Tracker</h1>
                    <p style="color: var(--text-light);">Keep track of all your job applications.</p>
                </div>
                <button class="btn btn-primary" id="btn-add-job">
                    <i class="fa-solid fa-plus" style="margin-right: 0.5rem;"></i> Add Job
                </button>
            </div>

            <div id="alert-container"></div>

            <div class="jobs-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="applied">Applied</button>
                <button class="filter-btn" data-filter="in_process">In Process</button>
                <button class="filter-btn" data-filter="selected">Selected</button>
                <button class="filter-btn" data-filter="not_selected">Not Selected</button>
            </div>

            <div id="jobs-container">
                <!-- Job cards rendered via JS -->
            </div>

        </main>
    </div>

    <!-- Add/Edit Job Modal -->
    <div class="modal-overlay" id="job-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Job Application</h2>
                <button class="close-modal" id="btn-close-modal">&times;</button>
            </div>
            <form id="job-form">
                <input type="hidden" id="job-id">
                <div class="form-group">
                    <label class="form-label">Company Name</label>
                    <input type="text" id="company" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Job Title</label>
                    <input type="text" id="job_title" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Location (Optional)</label>
                    <input type="text" id="location" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select id="status" class="form-control" required>
                        <option value="applied">Applied</option>
                        <option value="in_process">In Process</option>
                        <option value="selected">Selected</option>
                        <option value="not_selected">Not Selected</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Job URL (Optional)</label>
                    <input type="url" id="job_url" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Notes (Optional)</label>
                    <textarea id="notes" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;" id="btn-save-job">Save Application</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/applied-jobs.js"></script>
</body>
</html>
