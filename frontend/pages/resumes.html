<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Resumes - ResumeAI</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

</head>


<body>

<div class="dashboard-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <a
                href="dashboard.html"
                class="logo"
            >
                <i class="fa-solid fa-file-signature"></i>
                ResumeAI
            </a>

        </div>


        <nav class="sidebar-nav">

            <a
                href="dashboard.html"
                class="nav-item"
            >
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>


            <a
                href="upload.html"
                class="nav-item active"
            >
                <i class="fa-solid fa-upload"></i>
                Resume Analysis
            </a>


            <a
                href="resume-builder.html"
                class="nav-item"
            >
                <i class="fa-solid fa-pen-nib"></i>
                Resume Builder
            </a>


            <a
                href="interview.html"
                class="nav-item"
            >
                <i class="fa-solid fa-comments"></i>
                Interview Prep
            </a>


            <a
                href="job-matching.html"
                class="nav-item"
            >
                <i class="fa-solid fa-handshake"></i>
                Job Matching
            </a>


            <a
                href="applied-jobs.html"
                class="nav-item"
            >
                <i class="fa-solid fa-briefcase"></i>
                Applied Jobs
            </a>

        </nav>


        <div class="sidebar-footer">

            <button
                class="btn btn-outline"
                style="width:100%; justify-content:flex-start; border:none;"
                onclick="logout()"
            >

                <i
                    class="fa-solid fa-right-from-bracket"
                    style="margin-right:0.5rem;"
                ></i>

                Logout

            </button>

        </div>

    </aside>



    <!-- MAIN -->

    <main class="main-content">

        <div class="dashboard-header">

            <div>

                <h1>My Resumes</h1>

                <p style="color:var(--text-light);">
                    Select a resume to view or analyze it.
                </p>

            </div>


            <a
                href="upload.html"
                class="btn btn-primary"
            >

                <i class="fa-solid fa-upload"></i>

                Upload New Resume

            </a>

        </div>



        <!-- RESUMES -->

        <div
            id="resumes-container"
            class="data-section"
        >

            <div
                style="
                    padding:3rem;
                    text-align:center;
                "
            >

                <i class="fa-solid fa-spinner fa-spin"></i>

                <p>Loading resumes...</p>

            </div>

        </div>

    </main>

</div>



<script src="../js/api.js"></script>

<script src="../js/resumes.js"></script>


</body>

</html>
