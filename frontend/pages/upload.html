<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume - ResumeAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: 4rem 2rem;
            text-align: center;
            background-color: var(--bg-color);
            transition: all 0.2s ease;
            cursor: pointer;
            margin-bottom: 2rem;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary-color);
            background-color: rgba(37, 99, 235, 0.05);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .upload-text {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .upload-subtext {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        #file-input {
            display: none;
        }

        .result-container {
            display: none;
            text-align: center;
            padding: 2rem;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: var(--radius-lg);
            margin-top: 2rem;
        }

        .result-container h3 {
            color: var(--success);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar (Same as dashboard) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="logo">
                    <i class="fa-solid fa-file-signature"></i>
                    ResumeAI
                </a>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
                <a href="upload.html" class="nav-item active">
                    <i class="fa-solid fa-upload"></i>
                    Resume Analysis
                </a>
                <a href="resume-builder.html" class="nav-item">
                    <i class="fa-solid fa-pen-nib"></i>
                    Resume Builder
                </a>
                <a href="interview.html" class="nav-item">
                    <i class="fa-solid fa-comments"></i>
                    Interview Prep
                </a>
                <a href="job-matching.html" class="nav-item">
                    <i class="fa-solid fa-handshake"></i>
                    Job Matching
                </a>
                <a href="applied-jobs.html" class="nav-item">
                    <i class="fa-solid fa-briefcase"></i>
                    Applied Jobs
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-outline" style="width: 100%; justify-content: flex-start; border:none;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket" style="margin-right: 0.5rem;"></i>
                    Logout
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1>Upload Resume</h1>
                    <p style="color: var(--text-light);">Upload your resume to get AI analysis, ATS score, and more.</p>
                </div>
            </div>

            <div id="alert-container"></div>

            <div class="card">
                <div class="upload-area" id="upload-area">
                    <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                    <p class="upload-text">Drag & Drop your resume here</p>
                    <p class="upload-subtext">Supported formats: PDF, DOCX (Max 5MB)</p>
                    <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">Browse Files</button>
                    <input type="file" id="file-input" accept=".pdf,.docx">
                </div>
                
                <div id="loading-state" style="display: none; text-align: center; padding: 2rem;">
                    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
                    <p>Uploading resume...</p>
                </div>

                <div class="result-container" id="result-container">
                    <i class="fa-solid fa-circle-check" style="font-size: 3rem; color: var(--success); margin-bottom: 1rem;"></i>
                    <h3>Resume Uploaded Successfully!</h3>
                    <p id="resume-id-display" style="color: var(--text-light); margin-bottom: 1.5rem;"></p>
                    <div style="display: flex; gap: 1rem; justify-content: center;">
                        <button class="btn btn-primary" id="btn-analyze">Analyze Resume</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/upload.js"></script>
</body>
</html>
