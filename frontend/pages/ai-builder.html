<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Builder - ResumeAI</title>
    <meta name="description" content="Generate a professional resume instantly with AI. Pick a template, describe yourself, and let AI do the rest." />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/resume-builder.css">
    <link rel="stylesheet" href="../css/manual-builder.css">
    <link rel="stylesheet" href="../css/ai-builder.css">
</head>
<body>

    <div class="ai-layout">

        <!-- ── Left sidebar: controls ─────────────────────────────── -->
        <aside class="ai-sidebar">

            <div class="ai-sidebar-header">
                <a href="resume-builder.html" class="ai-back-link">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </a>
                <h2>AI Builder</h2>
            </div>

            <div id="alert-container" class="ai-alert-area"></div>

            <!-- 1. Template Selection -->
            <div class="ai-section">
                <div class="ai-section-title">
                    <span class="ai-step">1</span>
                    Select Template
                </div>
                <div id="ai-template-list" class="template-list ai-template-list">
                    <!-- Thumbnails injected by JS -->
                </div>
            </div>

            <!-- 2. Appearance -->
            <div class="ai-section">
                <div class="ai-section-title">
                    <span class="ai-step">2</span>
                    Appearance
                </div>

                <div class="ai-field">
                    <label for="ai-color-select">Theme Color</label>
                    <select id="ai-color-select" class="form-control">
                        <option value="#0ea5e9">Blue</option>
                        <option value="#10b981">Green</option>
                        <option value="#ef4444">Red</option>
                        <option value="#7c3aed">Purple</option>
                        <option value="#111827">Dark</option>
                    </select>
                </div>

                <div class="ai-field">
                    <label for="ai-font-select">Font</label>
                    <select id="ai-font-select" class="form-control">
                        <option value="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Inter (default)</option>
                        <option value="Georgia, 'Times New Roman', Times, serif">Georgia</option>
                        <option value="'Montserrat', sans-serif">Montserrat</option>
                        <option value="'Lora', serif">Lora</option>
                    </select>
                </div>
            </div>

            <!-- 3. AI Prompt -->
            <div class="ai-section ai-section-grow">
                <div class="ai-section-title">
                    <span class="ai-step">3</span>
                    Describe Your Resume
                </div>

                <form id="ai-builder-form">
                    <div class="ai-field">
                        <label for="resume_title" class="form-label">Resume Title</label>
                        <input type="text" id="resume_title" class="form-control"
                               placeholder="e.g. Data Scientist Resume" required>
                    </div>
                    <div class="ai-field">
                        <label for="ai_prompt" class="form-label">Instructions for AI</label>
                        <textarea id="ai_prompt" class="form-control" rows="7" required
                            placeholder="Create a professional resume for a Python Data Analyst with 2 years of experience. Highlight Python, SQL, Pandas, Power BI and machine learning projects..."></textarea>
                    </div>

                    <button type="submit" id="btn-generate-ai" class="btn btn-primary ai-generate-btn">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        Generate Resume with AI
                    </button>
                </form>
            </div>

        </aside>

        <!-- ── Right: Preview ───────────────────────────────────────── -->
        <main class="ai-preview-area">

            <!-- Toolbar: save + print fixed at top of preview -->
            <div id="preview-actions" class="ai-preview-toolbar" style="display:none;">
                <span class="ai-preview-label">
                    <i class="fa-solid fa-eye"></i> Live Preview
                </span>
                <div class="ai-toolbar-btns">
                    <button id="btn-print-ai" class="btn btn-outline">
                        <i class="fa-solid fa-print"></i> Print / PDF
                    </button>
                    <button id="btn-save-resume" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Save Resume
                    </button>
                </div>
            </div>

            <!-- Loading spinner -->
            <div id="loading-state" class="ai-loading" style="display:none;">
                <div class="ai-loading-inner">
                    <i class="fa-solid fa-circle-notch fa-spin ai-spinner"></i>
                    <p>AI is building your resume…</p>
                    <span class="ai-loading-sub">This may take a few seconds</span>
                </div>
            </div>

            <!-- Empty state -->
            <div id="empty-preview" class="ai-empty">
                <div class="ai-empty-inner">
                    <i class="fa-solid fa-wand-magic-sparkles ai-empty-icon"></i>
                    <h3>Your resume will appear here</h3>
                    <p>Select a template, describe yourself, and click <strong>Generate</strong>.</p>
                    <div class="ai-empty-steps">
                        <div class="ai-empty-step">
                            <span>1</span> Pick a template
                        </div>
                        <i class="fa-solid fa-arrow-right" style="color:#94a3b8;font-size:.75rem;"></i>
                        <div class="ai-empty-step">
                            <span>2</span> Describe yourself
                        </div>
                        <i class="fa-solid fa-arrow-right" style="color:#94a3b8;font-size:.75rem;"></i>
                        <div class="ai-empty-step">
                            <span>3</span> Generate &amp; download
                        </div>
                    </div>
                </div>
            </div>

            <!-- Preview root — JS renders templates here -->
            <div id="ai-preview-root" class="ai-preview-root template-1"
                 style="--accent:#0ea5e9; font-family:Inter,system-ui,sans-serif; display:none;">
            </div>

        </main>

    </div>

    <script src="../js/api.js"></script>
    <script src="../js/resume-templates.js"></script>
    <script src="../js/ai-builder.js"></script>
</body>
</html>
